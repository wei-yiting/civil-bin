 <rect width="230" height="350" fill="#fffdf7"/>
 <g font-family="sans-serif" fill="#164e3e"><text x="10" y="9" font-size="5" font-weight="bold">Civil Bin｜我們的垃圾桶</text><text x="10" y="18" font-size="3.5">隨手垃圾尺寸板 v1・每件對齊左下角，比較可完整放入的最小框</text></g>
