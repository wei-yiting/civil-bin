 <g font-family="sans-serif" font-size="5" font-weight="bold"><text x="15" y="35" fill="#aa5d28">大件 L｜20 × 30 公分內</text><text x="15" y="135" fill="#368a85">中件 M｜15 × 20 公分內</text><text x="15" y="185" fill="#236347">小件 S｜10 × 15 公分內</text></g>
 <path d="M5 320v10h10" fill="none" stroke="#164e3e" stroke-width="1"/>
